<!doctype html>

<title>Reagents and equipment — DMX-iGGA: 3 part lists in 3 rounds</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f6f2;
  --surface: #ffffff;
  --ink: #1c1e21;
  --muted: #5c626b;
  --line: #dedbd3;
  --accent: #1d6b58;
  --accent-soft: #e2f0eb;
  --caution: #8f4a00;
  --caution-soft: #fff1dc;
  --fail: #a11d1d;
  --fail-soft: #fdeaea;
  --expected: #1a4f8b;
  --expected-soft: #e8f1fc;
  --code-bg: #efede7;
  --gel: #15171c;
  --well: #030407;
  --band: #f3f0ff;
  --ladder: #a9bbff;
  --gel-ink: #c9ced6;
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111316;
    --surface: #191c20;
    --ink: #e7e5e0;
    --muted: #9ea4ac;
    --line: #2d3137;
    --accent: #6cc4a9;
    --accent-soft: #1a2d27;
    --caution: #f2b464;
    --caution-soft: #2b2316;
    --fail: #f28b8b;
    --fail-soft: #2e1a1a;
    --expected: #93bdf2;
    --expected-soft: #16212f;
    --code-bg: #23272c;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0 16px;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

.page { max-width: 54rem; margin: 0 auto; padding-block: 2rem 4rem; }

h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; margin: 0 0 0.5rem; }
h2 { font-size: 1.3rem; line-height: 1.3; margin: 0 0 0.75rem; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.4rem; }
p { margin: 0 0 0.75rem; }
a { color: var(--accent); overflow-wrap: anywhere; }
.muted { color: var(--muted); }

.summary { font-size: 1.08rem; color: var(--muted); max-width: 44rem; }

/* Short facts only: a card is a few words, so the row stays one height. A sentence is
   .highlights, and the model refuses one here. */
.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: 0.45rem; margin: 1.25rem 0 1rem; }
.overview div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.45rem 0.7rem; }
.overview dt { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.overview dd { margin: 0.1rem 0 0; font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }

.highlights { max-width: 44rem; margin: 0 0 1rem; }
.highlights p:last-child { margin-bottom: 0; }

.checks { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; padding: 0; margin: 0 0 0.6rem; }
.check { display: inline-flex; align-items: baseline; gap: 0.45rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.85rem; }
.check-name { overflow-wrap: anywhere; }
.verdict { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.is-pass .verdict { color: var(--accent); }
.is-warn { background: var(--caution-soft); border-color: var(--caution); }
.is-warn .verdict { color: var(--caution); }
.is-fail { background: var(--fail-soft); border-color: var(--fail); }
.is-fail .verdict { color: var(--fail); }
.is-none { border-style: dashed; }
.is-none .verdict { color: var(--muted); }
.check-detail { font-size: 0.9rem; color: var(--muted); margin: 0 0 0.3rem; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 1rem 0; }
.progress { margin-right: auto; font-weight: 600; }

button {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3rem 0.8rem;
  cursor: pointer;
  min-height: 2rem;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toc ol { display: flex; flex-wrap: wrap; gap: 0.35rem; list-style: none; padding: 0; margin: 0 0 1.5rem; counter-reset: toc; }
.toc li { counter-increment: toc; }
.toc a { display: inline-block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.85rem; }
.toc a::before { content: counter(toc) ". "; color: var(--muted); }

.block, .step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem; margin: 0 0 1rem; }
.step { scroll-margin-top: 1rem; }
.step.is-done { opacity: 0.6; }
.step > * + * { margin-top: 0.9rem; }

input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); flex: none; margin: 0.2rem 0 0; }
.step-title label { display: flex; gap: 0.6rem; align-items: baseline; cursor: pointer; }
.step-title input { align-self: center; margin: 0; }
.step-n { display: inline-grid; place-items: center; min-width: 1.8rem; height: 1.8rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.95rem; }

.instructions { padding-left: 0; list-style: none; margin-bottom: 0; }
.instructions li + li { margin-top: 0.35rem; }
.instructions label { display: flex; gap: 0.6rem; align-items: flex-start; cursor: pointer; }
.instructions input:checked + span { color: var(--muted); text-decoration: line-through; }

.caution { background: var(--caution-soft); color: var(--caution); border-radius: 8px; padding: 0.5rem 0.75rem; }
.expected { background: var(--expected-soft); border-radius: 8px; padding: 0.7rem 0.9rem; }
.expected h3 { color: var(--expected); }
.expected ul, .notes ul { margin: 0; padding-left: 1.2rem; }
.trouble dl { margin: 0; }
.trouble dt { font-weight: 600; }
.trouble dd { margin: 0 0 0.5rem; color: var(--muted); }

figure { margin: 0; }
figcaption { font-weight: 600; margin-bottom: 0.4rem; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 0.35rem 0.55rem; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: 0.78rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
tfoot th, tfoot td { font-weight: 700; border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.per-tube { color: var(--muted); }
.mix { font-weight: 600; }
.stage + .stage td { border-top: 2px solid var(--line); }

.count { display: inline-flex; align-items: center; gap: 0.45rem; margin: 0 0.5rem 0.5rem 0; font-size: 0.9rem; }
.count input { width: 4.5rem; font: inherit; padding: 0.2rem 0.4rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.dispense { font-size: 0.9rem; color: var(--muted); margin: 0.4rem 0 0; }

code, .seq { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em; }
.seq { background: var(--code-bg); border-radius: 4px; padding: 0.1rem 0.3rem; overflow-wrap: anywhere; }
.seq-cell { min-width: 12rem; }
.oligos .seq-cell { min-width: 14rem; }
.equipment { font-size: 0.92rem; color: var(--muted); margin: 0.7rem 0 0; }

.verdict-cell { white-space: nowrap; }
.oligos td .check { padding: 0.05rem 0.55rem; font-size: 0.78rem; }
.oligo-checks { font-size: 0.9rem; margin-top: 0.6rem; }
.oligo-checks summary { cursor: pointer; color: var(--muted); }
.oligo-checks ul { margin: 0.4rem 0 0; padding-left: 1.2rem; }
button.copy { font-size: 0.75rem; padding: 0.1rem 0.55rem; min-height: 1.6rem; margin-left: 0.25rem; }
button.is-copied { border-color: var(--accent); color: var(--accent); }

.timers { display: flex; flex-wrap: wrap; gap: 0.5rem; }
button.timer { display: inline-flex; gap: 0.5rem; align-items: baseline; }
.timer-time { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer-action { color: var(--accent); }
button.timer.is-running { border-color: var(--accent); background: var(--accent-soft); }
button.timer.is-finished { border-color: var(--caution); background: var(--caution-soft); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }

.gel-image { display: block; width: 100%; max-width: 30rem; height: auto; }
.gel-bg { fill: var(--gel); }
.well { fill: var(--well); }
.band { fill: var(--band); }
.ladder .band { fill: var(--ladder); }
.gel-image text { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--muted); }
.gel-image .lane-mark { text-anchor: middle; font-weight: 700; fill: var(--ink); }
.gel-image .size { text-anchor: end; }
.gel-legend { list-style: none; padding: 0; margin: 0.5rem 0 0; font-size: 0.88rem; }
.gel-legend strong { display: inline-block; min-width: 1.4rem; }

@media (max-width: 30rem) {
  .block, .step { padding: 0.9rem; }
  h2 { font-size: 1.15rem; }
}


/* A rule travels with its material, so it is shown and not written into a step. */
.rules { list-style: none; margin: 0 0 0.8rem; padding: 0; display: grid; gap: 0.4rem; }
.rule { border-left: 3px solid var(--caution); background: var(--caution-soft); padding: 0.45rem 0.7rem; border-radius: var(--radius); }
.rule.is-requires { border-left-color: var(--accent); background: var(--accent-soft); }

/* A hole is never a value: it is struck through where a number would stand and says so. */
.hole-count { background: var(--fail-soft); border: 1px dashed var(--fail); border-radius: var(--radius); padding: 0.5rem 0.8rem; }
.hole-none { font-variant: all-small-caps; letter-spacing: 0.04em; color: var(--fail); border-bottom: 2px dotted var(--fail); }
.holes ul, .holes-here { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
.hole { border: 1px dashed var(--fail); border-radius: var(--radius); padding: 0.45rem 0.7rem; background: var(--fail-soft); }
.hole-id { font-weight: 700; }
.hole-kind { color: var(--muted); }
.is-holed .num { color: var(--fail); }

/* The plate, drawn by `plot` and embedded here, beside the map, the sequence view and the gel. */
.plate svg { max-width: 100%; height: auto; }
.plate-legend, .vessels { list-style: none; margin: 0.4rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; }
.swatch { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 50%; margin-right: 0.3rem; vertical-align: -1px; }
.cite { color: var(--muted); font-size: 0.85em; }

/* A project folder: the run's nav bar across the top, a column either side of the page. */
.site { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0 1.4rem; margin: 0 -16px 0.5rem; padding: 0.6rem 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.site a { color: var(--muted); text-decoration: none; font-size: 0.9rem; padding: 0.15rem 0; }
.site a[aria-current] { color: var(--ink); box-shadow: inset 0 -2px var(--accent); }
.frame { display: grid; align-items: start; gap: 0 1.6rem; grid-template-columns: 13rem minmax(0, 1fr) 12rem; max-width: 80rem; margin: 0 auto; }
.frame .page { padding-block: 1.5rem 4rem; }
.column { position: sticky; top: 3.1rem; max-height: calc(100vh - 4.5rem); overflow: auto; padding-block: 1.6rem; font-size: 0.9rem; }
.column-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.45rem; }
.column ol { margin: 0; padding-left: 1.3rem; }
.column li { margin-bottom: 0.3rem; }
.column a { color: var(--muted); text-decoration: none; }
.column a:hover { color: var(--ink); text-decoration: underline; }
.column .is-here > a { color: var(--ink); font-weight: 600; }
.neighbours { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.9rem; }
.chain-pages { margin: 0; padding-left: 1.4rem; }
.chain-pages li { margin-bottom: 0.3rem; }

/* Too narrow for columns: both lists wrap into rows above the page, as the step list does. */
@media (max-width: 70rem) {
  .frame { display: flex; flex-direction: column; max-width: 54rem; }
  .frame .page { order: 1; padding-block: 0.5rem 4rem; }
  .column { position: static; max-height: none; overflow: visible; padding-block: 0.6rem 0; }
  .column ol { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; list-style: none; padding-left: 0; }
  .column li { margin-bottom: 0; }
  .column .is-here > a { text-decoration: underline; }
}

@media print {
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #000000;
    --muted: #3a3a3a;
    --line: #bdbdbd;
    --accent: #000000;
    --accent-soft: #ffffff;
    --caution-soft: #ffffff;
    --fail-soft: #ffffff;
    --expected-soft: #ffffff;
    --code-bg: #ffffff;
  }
  body { padding: 0; font-size: 10.5pt; }
  .page { max-width: none; padding: 0; }
  /* Paper has no navigation, so the line naming this page's neighbours carries the run. */
  .toolbar, .toc, .site, .column, button.copy, .timer-action { display: none !important; }
  .frame { display: block; max-width: none; }
  .frame .page { padding: 0; }
  .block, .step { border: none; border-top: 1px solid var(--line); border-radius: 0; padding: 0.6rem 0 0; }
  .step.is-done { opacity: 1; }
  .caution, .expected { border: 1px solid var(--line); }
  /* The verdict word carries the badge on paper, where the fill does not print. */
  .check { border: 1px solid var(--line); }
  /* Paper has no toggle, so the reasons print with the sheet. */
  .oligo-checks:not([open]) > ul { display: block; }
  .oligo-checks::details-content { content-visibility: visible; }
  button.timer { border: 1px solid var(--line); animation: none; }
  figure, table, .trouble dt, .gel { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  .count input { border: none; width: 2.5rem; }
  .gel-image { -webkit-print-color-adjust: exact; print-color-adjust: exact; max-width: 22rem; }
  .references a::after { content: none; }
}

<script>
(function () {
  "use strict";

  var storageKey = "liulab-protocol:" + (document.body.getAttribute("data-protocol") || "");

  // Storage can be missing or throw (private windows, blocked site data); the page works without it.
  function load() {
    try {
      return JSON.parse(window.localStorage.getItem(storageKey) || "{}") || {};
    } catch (error) {
      return {};
    }
  }

  function save() {
    try {
      window.localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (error) {
      /* checks last for this visit only */
    }
  }

  var state = load();

  function all(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  // Check marks.
  var boxes = all('input[type="checkbox"][data-key]');
  var stepBoxes = all("input.done");
  var progress = document.querySelector(".progress");

  function refresh() {
    var done = 0;
    stepBoxes.forEach(function (box) {
      var step = box.closest(".step");
      if (step) step.classList.toggle("is-done", box.checked);
      if (box.checked) done += 1;
    });
    if (progress) progress.textContent = done + " of " + stepBoxes.length + " steps done";
  }

  boxes.forEach(function (box) {
    box.checked = state[box.getAttribute("data-key")] === true;
    box.addEventListener("change", function () {
      var key = box.getAttribute("data-key");
      if (box.checked) state[key] = true;
      else delete state[key];
      save();
      refresh();
    });
  });
  refresh();

  var clear = document.querySelector("button.clear");
  if (clear) {
    clear.addEventListener("click", function () {
      boxes.forEach(function (box) {
        box.checked = false;
        delete state[box.getAttribute("data-key")];
      });
      save();
      refresh();
    });
  }

  var print = document.querySelector("button.print");
  if (print) print.addEventListener("click", function () { window.print(); });

  // Reaction tables: the arithmetic render.py writes the mix column with, and the rule of
  // protocol.model.number, so the column reads the same after the count changes.
  var SUPERSCRIPT = "⁰¹²³⁴⁵⁶⁷⁸⁹";

  function number(value) {
    if (value === 0) return "0";
    var parts = value.toExponential(2).split("e");
    var power = Number(parts[1]);
    if (Math.abs(value) >= 0.001 && Math.abs(value) < 1e6) {
      var fixed = value.toFixed(Math.max(0, 2 - power));
      if (fixed.indexOf(".") >= 0) fixed = fixed.replace(/0+$/, "").replace(/\.$/, "");
      var halves = fixed.split(".");
      halves[0] = halves[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return halves.join(".");
    }
    var mantissa = parts[0].replace(/\.?0+$/, "");
    var raised = String(power).replace(/\d/g, function (d) { return SUPERSCRIPT.charAt(d); });
    return mantissa + " × 10" + raised.replace("-", "⁻");
  }

  all(".reaction").forEach(function (figure) {
    var input = figure.querySelector("input.rxn-count");
    if (!input) return;
    var overage = parseFloat(figure.getAttribute("data-overage")) || 0;
    var key = input.getAttribute("data-key");

    function update() {
      var reactions = Math.max(1, Math.floor(Number(input.value) || 1));
      var scale = reactions * (1 + overage);
      all("[data-ul]", figure).forEach(function (cell) {
        cell.textContent = number(parseFloat(cell.getAttribute("data-ul")) * scale);
      });
      all(".rxn-n", figure).forEach(function (span) { span.textContent = String(reactions); });
      return reactions;
    }

    if (typeof state[key] === "number") input.value = String(state[key]);
    update();
    input.addEventListener("input", function () {
      state[key] = update();
      save();
    });
  });

  // Copy buttons.
  function fallbackCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try {
      return document.execCommand("copy");
    } catch (error) {
      return false;
    } finally {
      document.body.removeChild(area);
    }
  }

  function flash(button, label) {
    var original = button.getAttribute("data-label") || button.textContent;
    button.setAttribute("data-label", original);
    button.textContent = label;
    button.classList.add("is-copied");
    window.setTimeout(function () {
      button.textContent = original;
      button.classList.remove("is-copied");
    }, 1400);
  }

  all("button.copy").forEach(function (button) {
    button.addEventListener("click", function () {
      var text = button.getAttribute("data-copy") || "";
      var done = function () { flash(button, "Copied"); };
      var failed = function () { flash(button, fallbackCopy(text) ? "Copied" : "Copy failed"); };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, failed);
      } else {
        failed();
      }
    });
  });

  // Timers.
  function clock(seconds) {
    var s = Math.max(0, Math.round(seconds));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var rest = String(s % 60).padStart(2, "0");
    return h ? h + ":" + String(m).padStart(2, "0") + ":" + rest : m + ":" + rest;
  }

  function alarm() {
    try {
      var Context = window.AudioContext || window.webkitAudioContext;
      var context = new Context();
      [0, 0.35, 0.7].forEach(function (offset) {
        var tone = context.createOscillator();
        var gain = context.createGain();
        tone.frequency.value = 880;
        gain.gain.value = 0.15;
        tone.connect(gain);
        gain.connect(context.destination);
        tone.start(context.currentTime + offset);
        tone.stop(context.currentTime + offset + 0.2);
      });
    } catch (error) {
      /* no sound available */
    }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  all("button.timer").forEach(function (button) {
    var total = parseFloat(button.getAttribute("data-seconds")) || 0;
    var left = total;
    var end = 0;
    var handle = null;
    var time = button.querySelector(".timer-time");
    var action = button.querySelector(".timer-action");

    function show(label) {
      time.textContent = clock(left);
      action.textContent = label;
    }

    function stop() {
      window.clearInterval(handle);
      handle = null;
      button.classList.remove("is-running");
    }

    function tick() {
      left = Math.max(0, (end - Date.now()) / 1000);
      if (left <= 0) {
        stop();
        left = 0;
        button.classList.add("is-finished");
        show("Reset");
        alarm();
      } else {
        show("Pause");
      }
    }

    button.addEventListener("click", function () {
      if (handle !== null) {
        stop();
        show("Resume");
      } else if (left <= 0) {
        left = total;
        button.classList.remove("is-finished");
        show("Start");
      } else {
        end = Date.now() + left * 1000;
        handle = window.setInterval(tick, 250);
        button.classList.add("is-running");
        show("Pause");
      }
    });
  });
})();
</script>
</body>
</html>
