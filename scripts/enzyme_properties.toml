# Supplier properties for the enzymes the package ships, merged by `build_enzymes.py`.
#
# REBASE supplies the site, the cut offsets and the isoschizomers; nothing here repeats them.
# Each enzyme names the source its values were read from, `field_sources` overrides that per
# field, and `unverified` lists the fields no source stated. Methylation wording is the
# supplier's own, lower-cased. `heat_inactivation_celsius` is absent where the supplier says the
# enzyme is not inactivated by heat; where the supplier is silent it is absent AND unverified.
# `supplied_buffer` is the buffer the supplier sells this product in, named without its
# concentration: it is a property of the product, not of the enzyme name.
#
# A source carries `archived` when a value was read from a snapshot and `retrieved` when the
# live page was read. A block with both was read twice; the two readings agree, which
# `docs/research/restriction-enzyme-data.md` records.
#
# NEB pages are cited, never mirrored: their terms of use allow non-commercial individual
# reference only. `docs/research/restriction-enzyme-data.md` records that verdict.

[sources.rebase]
title = "REBASE, withrefm — all enzymes with references and isoschizomers"
url = "https://rebase.neb.com/rebase/link_withrefm"
retrieved = "2026-09-12"

